<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="QianKunBoss">
  <title>QianKunBoss</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12263F" stroke-width="1"/>
    </pattern>
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="9"  cy="13" r="1.2" fill="#58A6FF" opacity="0.70"/>
      <circle cx="37" cy="41" r="0.9" fill="#7DF9FF" opacity="0.55"/>
      <circle cx="53" cy="21" r="0.7" fill="#FFFFFF" opacity="0.35"/>
      <circle cx="22" cy="57" r="0.8" fill="#2C9CDF" opacity="0.45"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="280" fill="#060D16"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- 光晕（实色 + 模糊，非渐变） -->
  <circle cx="600" cy="152" r="210" fill="#1F6FEB" opacity="0.34" filter="url(#soft)"/>
  <circle cx="600" cy="152" r="120" fill="#2C9CDF" opacity="0.30" filter="url(#soft2)"/>
  <circle cx="150" cy="30"  r="70"  fill="#7DF9FF" opacity="0.16" filter="url(#soft2)"/>
  <circle cx="1060" cy="252" r="80" fill="#7DF9FF" opacity="0.14" filter="url(#soft2)"/>

  <!-- 星点 -->
  <rect width="1200" height="280" fill="url(#stars)"/>

  <!-- 科技边框四角 -->
  <g stroke="#1F6FEB" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M26 62V26h40"/>
    <path d="M1174 62V26h-40"/>
    <path d="M26 218v36h40"/>
    <path d="M1174 218v36h-40"/>
  </g>
  <g stroke="#16304D" stroke-width="1" fill="none">
    <path d="M92 26h1016" opacity="0.5"/>
    <path d="M92 254h1016" opacity="0.5"/>
  </g>

  <!-- 顶部高亮条 -->
  <rect x="0" y="0" width="1200" height="3" fill="#1F6FEB"/>

  <!-- 标题 -->
  <text x="600" y="132" text-anchor="middle"
        font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif"
        font-size="84" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">QianKunBoss</text>

  <!-- 副标题 -->
  <text x="600" y="176" text-anchor="middle"
        font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif"
        font-size="20" fill="#58A6FF">用代码把想法变成系统</text>

  <!-- 技术标签行 -->
  <text x="600" y="212" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Consolas,monospace"
        font-size="12" letter-spacing="4.2" fill="#7DF9FF" opacity="0.78">VUE · NODE · TYPESCRIPT · MINECRAFT</text>

  <!-- 底部波浪 -->
  <path d="M0 262 C 300 288, 900 236, 1200 262 L1200 280 L0 280 Z" fill="#0B1F33" opacity="0.85"/>
</svg>
